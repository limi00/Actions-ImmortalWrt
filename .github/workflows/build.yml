name: 🚀 编译 (Build)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'ImmortalWrt 仓库的拥有者 (Owner of ImmortalWrt repo)'
        type: string
        required: true
        default: 'immortalwrt'
      repo:
        description: 'ImmortalWrt 仓库的名字 (Name of ImmortalWrt repo)'
        type: string
        required: true
        default: 'immortalwrt'
      branch:
        description: 'ImmortalWrt 仓库的分支 (Branch of ImmortalWrt repo)'
        type: string
        required: true
        default: 'openwrt-25.12'
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{inputs.ssh == false}}
    runs-on: ubuntu-24.04
    name: 🚀 编译 (Build)
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/lib/android /usr/lib/llvm-* /opt/hostedtoolcache/CodeQL
          sudo apt clean
          docker system prune -af 2>/dev/null || true
          df -hT
          
      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: '${{inputs.owner}}/${{inputs.repo}}'
          ref: ${{inputs.branch}}
          submodules: recursive
          fetch-depth: 1
          path: ImmortalWrt

      - name: 复制当前仓库的配置文件到 ImmortalWrt 仓库  (Copy current repo config to ImmortalWrt repo)
        run: |
          for f in .config feeds.conf.default diy.sh; do
            [ -f "$f" ] && cp -f "$f" ImmortalWrt/ || echo "⚠️ $f not found, skipping"
          done

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh 2>/dev/null || true
          [ -x ./diy.sh ] && ./diy.sh || echo "ℹ️ No diy.sh, skipping"

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 再次复制当前仓库的配置文件到 ImmortalWrt 仓库 (Copy current repo config to ImmortalWrt repo again)
        run: |
          for f in .config feeds.conf.default diy.sh; do
            [ -f "$f" ] && cp -f "$f" ImmortalWrt/ || true
          done

      - name: 生成配置
        working-directory: ImmortalWrt
        run: make defconfig

      - name: 预下载源码包
        working-directory: ImmortalWrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译前上传配置 (Upload config before build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) || make -j1 || make -j1 V=s

      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-build-result
          path: ImmortalWrt/bin/targets

  build-ssh:
    if: ${{ inputs.ssh == true }}
    runs-on: ubuntu-24.04
    name: 🚀 编译 (Build) - SSH
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/lib/android /usr/lib/llvm-* /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          df -hT

      - name: 下载编译所需的依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 1
          path: ImmortalWrt

      - name: 复制配置文件
        run: |
          for f in .config feeds.conf.default diy.sh; do
            [ -f "$f" ] && cp -f "$f" ImmortalWrt/ || echo "⚠️ $f not found, skipping"
          done

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh 2>/dev/null || true
          [ -x ./diy.sh ] && ./diy.sh || echo "ℹ️ No diy.sh, skipping"

      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 再次复制配置文件
        run: |
          for f in .config feeds.conf.default diy.sh; do
            [ -f "$f" ] && cp -f "$f" ImmortalWrt/ || true
          done

      - name: 生成配置
        working-directory: ImmortalWrt
        run: make defconfig

      - name: 预下载源码包
        working-directory: ImmortalWrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译前上传配置
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 🔑 开启 SSH 调试 (upterm)
        uses: lhotari/action-upterm@v1
        timeout-minutes: 60
        with:
          wait-timeout-minutes: 40
          limit-access-to-actor: true
          GITHUB_TOKEN: ${{ github.token }}

      - name: 编译前再次释放空间
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/lib/android
          df -hT

      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) || make -j1 || make -j1 V=s

      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-build-result
          path: ImmortalWrt/bin/targets
